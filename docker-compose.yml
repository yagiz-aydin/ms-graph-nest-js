services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  applications:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: applications
    env_file:
      - .env
    restart: unless-stopped

  emails:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: emails
    env_file:
      - .env
    restart: unless-stopped

  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: search
    env_file:
      - .env
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user
    env_file:
      - .env
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    ports:
      - '8200:8200'
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 'root'
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
      VAULT_ADDR: 'http://0.0.0.0:8200'
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
